name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      - name: Configure Core RDP Settings
        run: |
          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # Disable Network Level Authentication
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          # Use RDP security layer
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          # Enable RDP firewall rules
          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          # Restart RDP service
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        run: |
          $username = "RDP"
          $password = "Kazi01071994"

          # Remove old user if it exists
          $existingUser = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if ($existingUser) {
              Remove-LocalUser -Name $username
              Start-Sleep -Seconds 2
          }

          # Create fixed-password local account
          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -UserMayNotChangePassword

          # Add to Administrators
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username

          # Add to Remote Desktop Users
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username

          # Verify account
          $user = Get-LocalUser -Name $username

          if (-not $user) {
              Write-Error "RDP user creation failed"
              exit 1
          }

          Write-Host "RDP user created successfully."

      - name: Configure RDP Authentication
        run: |
          # Make sure the RDP user is enabled
          Enable-LocalUser -Name "RDP"

          # Ensure password is set correctly
          $password = "Kazi01071994"

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          Set-LocalUser `
            -Name "RDP" `
            -Password $securePassword `
            -PasswordNeverExpires $true

          # Verify RDP service
          Set-Service `
            -Name TermService `
            -StartupType Automatic

          Start-Service -Name TermService -ErrorAction SilentlyContinue

          Write-Host "RDP authentication configured."

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 20) {

              $tsIP = (& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4).Trim()

              if ($tsIP) {
                  break
              }

              Start-Sleep -Seconds 5
              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP was not assigned."
              exit 1
          }

          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host "Tailscale IP: $tsIP"

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Testing RDP port 3389..."

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389

          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed."
              exit 1
          }

          Write-Host "RDP port 3389 is accessible."

      - name: Verify RDP User
        run: |
          Write-Host "Checking RDP account..."

          $user = Get-LocalUser -Name "RDP"

          if (-not $user.Enabled) {
              Write-Error "RDP account is disabled."
              exit 1
          }

          Write-Host "Username: .\RDP"
          Write-Host "RDP account is enabled."
          Write-Host "RDP service is running."

      - name: Maintain Connection
        run: |
          Write-Host ""
          Write-Host "===================================="
          Write-Host "          RDP ACCESS"
          Write-Host "===================================="
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: .\RDP"
          Write-Host "Password: Kazi01071994"
          Write-Host "===================================="
          Write-Host ""

          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active"
              Start-Sleep -Seconds 300
          }
