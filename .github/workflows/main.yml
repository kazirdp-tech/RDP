name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force


      - name: Create RDP User
        run: |
          $username = "RDP"
          $password = "Kazi01071994"

          $existingUser = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if ($existingUser) {
              Remove-LocalUser -Name $username
              Start-Sleep -Seconds 2
          }

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -UserMayNotChangePassword

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username

          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "RDP user creation failed"
              exit 1
          }

          Write-Host "RDP user created successfully."


      - name: Enable Windows Automatic Logon
        run: |
          $winlogon = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon"

          # Enable automatic Windows logon
          Set-ItemProperty `
            -Path $winlogon `
            -Name "AutoAdminLogon" `
            -Value "1" `
            -Type String `
            -Force

          # Username
          Set-ItemProperty `
            -Path $winlogon `
            -Name "DefaultUserName" `
            -Value "RDP" `
            -Type String `
            -Force

          # Password
          Set-ItemProperty `
            -Path $winlogon `
            -Name "DefaultPassword" `
            -Value "Kazi01071994" `
            -Type String `
            -Force

          # Local computer
          Set-ItemProperty `
            -Path $winlogon `
            -Name "DefaultDomainName" `
            -Value $env:COMPUTERNAME `
            -Type String `
            -Force

          # Force automatic logon
          Set-ItemProperty `
            -Path $winlogon `
            -Name "ForceAutoLogon" `
            -Value "1" `
            -Type String `
            -Force

          Write-Host "Windows automatic logon configured."


      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installerPath -Force


      - name: Tailscale Browser Authorization
        shell: powershell
        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          $logFile = "$env:TEMP\tailscale-auth.log"
          $errFile = "$env:TEMP\tailscale-auth-error.log"

          Remove-Item $logFile -Force -ErrorAction SilentlyContinue
          Remove-Item $errFile -Force -ErrorAction SilentlyContinue

          Write-Host "Starting Tailscale browser authentication..."

          $process = Start-Process `
            -FilePath $tailscale `
            -ArgumentList @(
              "up",
              "--unattended=true",
              "--hostname=gh-runner-$env:GITHUB_RUN_ID"
            ) `
            -RedirectStandardOutput $logFile `
            -RedirectStandardError $errFile `
            -PassThru `
            -WindowStyle Hidden

          $authUrl = $null
          $retries = 0

          while (-not $authUrl -and $retries -lt 60) {

              if (Test-Path $logFile) {
                  $output = Get-Content $logFile -Raw -ErrorAction SilentlyContinue

                  if ($output) {
                      $match = [regex]::Match(
                        $output,
                        'https://login\.tailscale\.com/[^\s]+'
                      )

                      if ($match.Success) {
                          $authUrl = $match.Value.Trim()
                          break
                      }
                  }
              }

              Start-Sleep -Seconds 2
              $retries++
          }

          if ($authUrl) {

              Write-Host ""
              Write-Host "=============================================="
              Write-Host " TAILSCALE BROWSER AUTHORIZATION REQUIRED"
              Write-Host "=============================================="
              Write-Host $authUrl
              Write-Host "=============================================="
              Write-Host ""

              # Put clickable URL in GitHub Actions summary
              Add-Content `
                -Path $env:GITHUB_STEP_SUMMARY `
                -Value "## Tailscale Authorization`n`n[**OPEN TAILSCALE AUTHORIZATION LINK**]($authUrl)`n`nOpen this link in your phone browser and authorize the VM."

          } else {

              Write-Host "No authentication URL was generated."
              Write-Host "Tailscale may already be authenticated."

          }

          # Wait until Tailscale becomes authenticated
          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 180) {

              try {
                  $tsIP = (& $tailscale ip -4 2>$null).Trim()
              } catch {
                  $tsIP = $null
              }

              if ($tsIP) {
                  break
              }

              Write-Host "Waiting for browser authorization... ($retries/180)"
              Start-Sleep -Seconds 5
              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale authorization was not completed."
              exit 1
          }

          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "Tailscale connected successfully."
          Write-Host "Tailscale IP: $tsIP"


      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389

          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }

          Write-Host "TCP connectivity successful!"


      - name: Maintain Connection
        run: |
          Write-Host ""
          Write-Host "===================================="
          Write-Host "          RDP ACCESS"
          Write-Host "===================================="
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: .\RDP"
          Write-Host "Password: Kazi01071994"
          Write-Host "===================================="
          Write-Host ""

          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active"
              Start-Sleep -Seconds 300
          }
